<script>
const INFO = {"rest": {"color": "#1E7BEA", "line": "Bonġu {u}! Jien {b}."}, "listen": {"color": "#0FA3C9", "line": "Qed nisimgħek, {u}…"}, "think": {"color": "#7A4FE0", "line": "Ħallini naħseb…"}, "idea": {"color": "#E39A00", "line": "Sibtha!"}, "read": {"color": "#1F9E6E", "line": "Ħa naqralek."}, "oops": {"color": "#5B6B80", "line": "Ma fhimtx. Erġa' għidli?"}, "done": {"color": "#239B56", "line": "Lest! Il-messaġġ daħal."}, "sleep": {"color": "#3B3F9A", "line": "Zzz… {b} rieqed."}, "shy": {"color": "#E0559A", "line": "Grazzi, {u}… qed tistħini!"}, "surprise": {"color": "#F07C1E", "line": "Ara! Messaġġ ġdid!"}, "laugh": {"color": "#F0623C", "line": "Ħa ħa! Int tidħakni, {u}!"}, "wow": {"color": "#D9A400", "line": "Wow, {u}! Sabiħ ħafna!"}, "party": {"color": "#0D8BD9", "line": "Prosit, {u}! Kelma ġdida!"}, "love": {"color": "#E23B5A", "line": "Anke jien inħobbok, {u}!"}, "sad": {"color": "#5A7BA8", "line": "M'hemmx internet… imdejjaq."}};
let cur = null, hideT = null, langs = ["MT","EN","IT"], li = 0, clipped = false, user = "Clifford", bud = "Kelma";
const LANGNAME = {MT: ["Malti", "Issa nikteb bil-Malti."], EN: ["English", "Now I write in English."], IT: ["Italiano", "Ora scrivo in italiano."]};
const call = p => fetch("/" + p).catch(() => {});
function toggle() {
  const open = !document.body.classList.contains("open");
  if (open) call("menu?open=1");
  setTimeout(() => document.body.classList.toggle("open", open), open ? 60 : 0);
  if (!open) setTimeout(() => call("menu?open=0"), 250);
}
function act(k) {
  if (k === "lang") {
    li = (li + 1) % 3; const c = langs[li];
    document.querySelectorAll(".flag").forEach(f => f.style.display = f.dataset.code === c ? "block" : "none");
    document.querySelector("#b-lang .tip").innerHTML = "Language: " + LANGNAME[c][0];
    say(LANGNAME[c][1], "#E39A00"); return;
  }
  if (k === "clip") {
    clipped = !clipped; document.body.classList.toggle("clipped", clipped);
    document.querySelector("#b-clip .tip").innerHTML = clipped ? "Unclip<br><b>Neħħi</b>" : "Clip here<br><b>Waħħal hawn</b>";
    say(clipped ? "Waħħalt hawn. Ma nitħarrikx." : "Issa tista' tkaxkarni.", "#475569"); return;
  }
  document.body.classList.remove("open"); setTimeout(() => call("menu?open=0"), 250);
  call("act?k=" + k);
}
function say(text, color) {
  const s = document.getElementById("say"); s.textContent = text; s.style.borderColor = color; s.style.opacity = 1;
  clearTimeout(hideT); hideT = setTimeout(() => s.style.opacity = 0, 5000);
}
// press = open menu, press and move = drag (unless clipped)
const B = document.getElementById("buddy");
let down = null, dragging = false;
B.addEventListener("mousedown", e => { if (e.button === 0) { down = [e.screenX, e.screenY]; dragging = false; } });
window.addEventListener("mousemove", e => {
  if (!down || dragging || clipped) return;
  if (Math.abs(e.screenX - down[0]) + Math.abs(e.screenY - down[1]) > 6) { dragging = true; B.classList.add("dragging"); call("drag?on=1"); }
});
window.addEventListener("mouseup", e => {
  if (!down) return;
  if (dragging) { call("drag?on=0"); B.classList.remove("dragging"); }
  else if (e.target.closest("#buddy")) {
    if (clipped && !document.body.classList.contains("open")) say("Jien imwaħħal hawn. Agħfas il-klipp biex tneħħih.", "#475569");
    toggle();
  }
  down = null; dragging = false;
});
function setMood(key, user, buddy) {
  const i = INFO[key]; if (!i) return;
  const fill = t => t.split("{u}").join(user).split("{b}").join(buddy);
  if (cur !== key) {
    document.querySelectorAll(".mood").forEach(d => d.style.display = "none");
    const el = document.getElementById("m-" + key);
    el.style.display = "block"; el.classList.remove("popin"); void el.offsetWidth; el.classList.add("popin");
    cur = key;
  }
  const say = document.getElementById("say");
  say.textContent = fill(i.line); say.style.borderColor = i.color; say.style.opacity = 1;
  clearTimeout(hideT); hideT = setTimeout(() => say.style.opacity = 0, key === "rest" ? 4000 : 6000);
  const nm = document.getElementById("name"); nm.textContent = buddy; nm.style.color = i.color;
}
setMood("rest", "Clifford", "Kelma");
